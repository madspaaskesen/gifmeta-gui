name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write  # Required for uploading release assets

jobs:
  build:
    name: Build installers only
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bundles: appimage

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            bundles: dmg

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bundles: msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install JSCoreGTK 4.0
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt --fix-missing install
          sudo apt-get install -y libjavascriptcoregtk-4.1-0 libjavascriptcoregtk-4.1-dev

      - name: Install system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            pkg-config \
            libssl-dev \
            webkit2gtk-4.1-dev

      - name: Install npm dependencies
        run: npm install

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      #- name: Install Tauri CLI
      #  run: cargo install tauri-cli --force

      #- name: Build frontend + Tauri app
      #  run: cargo tauri build --target ${{ matrix.target }}
      
      - name: Build frontend + Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      #- name: Build frontend
      #  run: npm run tauri build --target ${{ matrix.target }}

      - name: Copy installer to release-dist/
        shell: bash
        run: |
          mkdir -p release-dist

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-dist/
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi release-dist/
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-dist/
          fi

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
