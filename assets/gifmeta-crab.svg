      <path class="ol" stroke-width="12" d="M240 604 L268 664 M252 714 L286 768 M328 785 L362 816" />
      <!-- arm -->
      <path class="ol" stroke-width="80" d="M318 545 C245 500 228 440 262 392" />
      <path class="in" stroke-width="56" d="M318 545 C245 500 228 440 262 392" />
      <!-- claw -->
      <path class="shape" d="M270 408 C214 401 199 330 214 250 C228 170 268 96 300 76 L289 262 L352 146 C376 202 373 300 346 360 C327 400 302 411 270 408 Z" />
