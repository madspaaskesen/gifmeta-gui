      .shape { fill: #E0592C; stroke: #862E13; stroke-width: 18; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- LEFT side (edit this one). The right side is a mirrored clone of it (axis x = 466). -->
  <g id="side" transform="matrix(1.09176 0 0 0.97817 -16.307 1.968)">
