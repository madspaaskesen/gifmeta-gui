      <path class="shape" stroke-width="16" d="M306 604 L240 604 C210 640 186 700 181 744 Q184 762 199 748 C216 714 241 684 268 664 L306 668 Z" />
      <path class="shape" stroke-width="16" d="M318 684 L252 714 C236 760 225 820 226 866 Q235 882 247 866 C255 830 268 790 286 768 L338 738 Z" />
